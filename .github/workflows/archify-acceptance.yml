name: Architecture renderer acceptance

on:
  push:
  pull_request:

jobs:
  archify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Archify through the skill installer
        run: python3 scripts/install_renderers.py --engine archify
      - name: Run official Archify acceptance test
        env:
          ARCHIFY_OFFICIAL_CLI: ${{ github.workspace }}/.renderers/managed/bin/archify
        run: python3 scripts/test_architecture.py
      - name: Run all five native Archify mode tests
        env:
          ARCHIFY_OFFICIAL_CLI: ${{ github.workspace }}/.renderers/managed/bin/archify
        run: python3 -m unittest discover -s scripts -p test_native_diagrams.py
    env:
      UNDERSTAND_RENDERER_HOME: ${{ github.workspace }}/.renderers/managed

  diagram-renderers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned official renderers through the skill installer
        run: |
          python3 scripts/install_renderers.py --engine mermaid --engine plantuml --engine drawio
          # GitHub's Ubuntu runner blocks Chromium's user-namespace sandbox; scope this override to CI.
          printf '{"args":["--no-sandbox"]}\n' > /tmp/mermaid-puppeteer-ci.json
          printf '#!/bin/sh\nexec "%s" --puppeteerConfigFile /tmp/mermaid-puppeteer-ci.json "$@"\n' "$UNDERSTAND_RENDERER_HOME/bin/mmdc" > /tmp/mmdc-ci
          chmod +x /tmp/mmdc-ci
      - name: Run official Mermaid, PlantUML, and draw.io acceptance test
        env:
          MERMAID_OFFICIAL_CLI: /tmp/mmdc-ci
          PLANTUML_OFFICIAL_CLI: ${{ github.workspace }}/.renderers/managed/bin/plantuml
          DRAWIO_OFFICIAL_CLI: ${{ github.workspace }}/.renderers/managed/bin/drawio
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
    env:
      UNDERSTAND_RENDERER_HOME: ${{ github.workspace }}/.renderers/managed
